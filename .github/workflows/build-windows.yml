name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Generate icon
        run: python src-tauri/icons/generate-icon.py
      - name: Generate icons
        run: npx @tauri-apps/cli icon src-tauri/icons/icon.png
      - name: Build Tauri app
        run: npm run tauri build
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: openloc-windows
          path: src-tauri/target/release/bundle/
